name: fk_user_agent
description: Retrieve Android/iOS device user agents in Flutter.
version: 2.1.0
homepage: https://github.com/flutter-fast-kit/fk_user_agent

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.flutterfastkit.fk_user_agent
        pluginClass: FkUserAgentPlugin
      ios:
        pluginClass: FkUserAgentPlugin
